[project]
name = "bumblebee"
version = "0.1.0"
description = "MFCC feature extraction from bumblebee WAV recordings"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "librosa>=0.10",
    "matplotlib>=3.10.9",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "soundfile>=0.12",
]

[project.scripts]
preprocess = "preprocessdata:main"

[tool.hatch.build.targets.wheel]
only-include = ["src/preprocessdata.py"]
sources = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
]
